<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 11 - Smart Search Engine (Trie + Heap)</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="w-full max-w-2xl bg-slate-800 rounded-xl shadow-xl p-6 border border-slate-700">
        <h1 class="text-2xl font-bold text-cyan-400 mb-2">Smart Search Engine</h1>
        <p class="text-sm text-slate-400 mb-6">Filtrado por prefijo con <strong>Trie</strong> y Top $K$ con <strong>Heap</strong>.</p>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="md:col-span-2">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Buscar por prefijo</label>
                <input type="text" id="prefixInput" placeholder="Ej. air, ad..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-cyan-500"
                    oninput="realizarBusqueda()">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Top K resultados</label>
                <input type="number" id="kInput" value="2" min="1" max="10" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-cyan-500"
                    onchange="realizarBusqueda()">
            </div>
        </div>

        <div class="border-t border-slate-700 pt-4">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">Resultados en Tiempo Real</h2>
            <div id="resultsContainer" class="space-y-3">

            </div>
        </div>
    </div>

    <script>
        async function realizarBusqueda() {
            const prefix = document.getElementById('prefixInput').value;
            const k = document.getElementById('kInput').value;
            
            try {
                const response = await fetch(`http://localhost:3000/api/search?prefix=${encodeURIComponent(prefix)}&k=${k}`);
                const data = await response.json();
                
                const container = document.getElementById('resultsContainer');
                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = `<p class="text-slate-500 text-sm italic">No se encontraron productos para este prefijo.</p>`;
                    return;
                }

                data.forEach((item, index) => {
                    container.innerHTML += `
                        <div class="bg-slate-900/50 border border-slate-700/60 rounded-lg p-3 flex justify-between items-center">
                            <div class="flex items-center space-x-3">
                                <span class="bg-cyan-500/10 text-cyan-400 font-bold px-2.5 py-1 rounded text-xs">#${index + 1}</span>
                                <span class="font-medium text-slate-200 capitalize">${item.name}</span>
                            </div>
                            <span class="text-xs bg-slate-800 text-slate-300 px-2 py-1 rounded border border-slate-700">Popularidad: ${item.popularity}</span>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error al conectar con el servidor:', error);
            }
        }

        realizarBusqueda();
    </script>
</body>
</html>
